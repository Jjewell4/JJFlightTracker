<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0e16" />
    <script>
      // Apply the saved theme before first paint so launching the app never flashes the wrong theme.
      (function () {
        try {
          var t = localStorage.getItem('flightlog.theme');
          if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
          var light = t === 'light' || (t !== 'dark' && window.matchMedia('(prefers-color-scheme: light)').matches);
          document.querySelector('meta[name="theme-color"]').setAttribute('content', light ? '#f4f6fb' : '#0a0e16');
        } catch (e) {}
      })();
    </script>
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="Your personal flight log — every flight, route and mile." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FlightDiary" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <title>FlightDiary</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
